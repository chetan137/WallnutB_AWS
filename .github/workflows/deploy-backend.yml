name: Deploy Backend

# This repo IS the backend (root = server.js, config/, routes/, ...),
# so every push to main deploys.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: node --check every .js file
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  deploy:
    name: Deploy to EC2
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2, pull latest, restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/WallnutB_AWS
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 startOrReload pm2.config.js --update-env
            pm2 save
